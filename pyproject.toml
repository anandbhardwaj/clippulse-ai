[project]
name = "clippulse-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.7.0",
    "google-genai>=2.24.0",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
